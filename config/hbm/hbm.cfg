# Configuration file

01_general {
    # Enables creation of a separate thread to increase packet processing speed on servers. Disable this if you are having anomalous crashes related to memory connections.
    B:0.01_enablePacketThreading=true

    # Number of core threads to create for packets (recommended 1).
    I:0.02_packetThreadingCoreCount=1

    # Maximum number of threads to create for packet threading. Must be greater than or equal to 0.02_packetThreadingCoreCount.
    I:0.03_packetThreadingMaxCount=2

    # Forces the bypassing of most packet threading errors, only enable this if directed to or if you know what you're doing.
    B:0.04_packetThreadingErrorBypass=false

    # Syncs any recipes customised via JSON to clients connecting to the server.
    B:0.05_enableServerRecipeSync=true

    # Routes non-NTM packets back through Forge's default networking path so mods with broken ByteBuf reference counting do not touch NTM's zero-copy hook.
    B:0.06_enableZeroCopyCompatibilityMode=false

    # Enables threaded updating of the nodespace. This can improve performance, but may cause issues with certain mods.
    B:0.07_enableThreadedNodeSpaceUpdate=true

    # Enables automatic block replacement for missing blocks to avoid giant holes in the ground when they got removed. This may severely impact chunkloading performance,
    # only enable when you are sure that we removed some blocks AND we added that to this replacement system AND you are absolutely sure about what you are doing.
    # Currently only works for hbm:waste_*.
    B:0.99_CE_01_enableBlockAutoReplacing=false

    # Set to false to disable all NTM advancements.
    B:0.99_CE_02_enableAdvancements=true

    # Enable debugging mode
    B:1.00_enableDebugMode=false

    # Enable debugging mode for phased structure generation. Separate from the previous option!
    B:1.00_enableDebugWorldGen=false

    # If enabled, will try to use NTM's custom skyboxes.
    B:1.00_enableSkybox=false

    # Allows glowing mycelium to spread
    B:1.01_enableMyceliumSpread=false

    # Enables plutonium ore generation in the nether
    B:1.02_enablePlutoniumNetherOre=false

    # Allows structures and dungeons to spawn.
    B:1.03_enableDungeonSpawn=true

    # Allows NTM ores to generate in modded dimensions
    B:1.04_enableOresInModdedDimensions=true

    # Allows landmines to generate
    B:1.05_enableLandmineSpawn=true

    # Allows radiation hotspots to generate
    B:1.06_enableRadHotspotSpawn=true

    # Allows chests to spawn at specific coordinates full of powders
    B:1.07_enableNITANChestSpawn=true

    # Allows for waste earth blocks (dirt, grass, mycellium) to turn back into dirt immediately.
    B:1.09_enableAutomaticRadCleanup=false

    # Enables the singular meteor strikes. If set to false, meteorites will never spawn.
    B:1.10_enableMeteorStrikes=true

    # Enables the meteor shower event. Separate from the previous option!
    B:1.11_enableMeteorShowers=true

    # Enables the meteor smoke trail effect behind it.
    B:1.12_enableMeteorTails=true

    # Allows for special meteors to spawn. NOT RECOMMENDED FOR REGULAR SURVIVAL
    B:1.13_enableSpecialMeteors=false

    # Has bomber planes spawn in closer to the target for use with smaller render distances
    B:1.14_enableBomberShortMode=false

    # Allows locked safes to spawn
    B:1.15_enableVaultSpawn=true
    B:1.16_enableNewRadiation=true

    # GENERAL SWITCH: Enables radiation system
    B:1.16_enableRadiation=true

    # Causes satellites to fall whenever a mob dies
    B:1.17_enableCataclysm=false

    # Logs uses of the detonator, nuclear explosions, missile launches, grenades, etc.
    B:1.18_enableExtendedLogging=false
    B:1.19_enableHardcoreTaint=false

    # Prevents new system guns to be fired
    B:1.20_enableGuns=true

    # Allows virus blocks to spread
    B:1.21_enableVirus=false

    # Shows custom crosshairs when an NTM gun is being held
    B:1.22_enableCrosshairs=true
    B:1.23_enableShaders=false

    # Enables old NTM Reloaded shaders, courtesy of Drillgon. NOT RECOMMENDED TO TURN IT ON
    B:1.23_enableShaders2=false

    # Enable old reflector oredict name ("plateDenseLead") instead of new "plateTungCar"
    B:1.24_enableReflectorCompat=false

    # Which supershotgun reload animation to use. True is Drillgon's animation, false is Bob's animation
    B:1.24_ssgAnimType=true

    # Enables normal mapping on bullet holes, which can improve visuals
    B:1.25_bullet_hole_normal_mapping=true

    # Enables effects that make use of reading from the depth buffer
    B:1.25_depthBufferEffects=true

    # Enables volumetric lighting for directional lights
    B:1.25_flashlight_volumetrics=true

    # Enables dynamic directional lights
    B:1.25_flashlights=true

    # The maximum number of 'flowing' decals that can exist at once (eg blood that can flow down walls)
    I:1.25_flowing_decal_max=20

    # Enables instanced particle rendering for supported particles, including Torex cloudlets and RBMK particles, which makes them render several times faster. May not work on all computers, and will break with shaders.
    B:1.25_instancedParticles=true

    # Enables call lists for a few models, making them render extremely fast
    B:1.26_callListModels=true

    # Allows the asbestos gas to spawn (e.g. after breaking asbestos ore or chrysotile).
    B:1.26_enableAsbestosDust=true

    # Allows the carbon monoxide gas to spawn (e.g. after breaking nether coal ore).
    B:1.26_enableCarbonMonoxide=true

    # Allows the coal gas to spawn (e.g. after breaking coal ore).
    B:1.26_enableCoalDust=true

    # Allows the explosive gas to spawn in the world.
    B:1.26_enableExplosiveGas=true

    # Allows the flammable gas to spawn in the world.
    B:1.26_enableFlammableGas=true

    # Allows the meltdown gas to spawn (e.g. after ZIRNOX explosion).
    B:1.26_enableMeltdownGas=true

    # Allows the radon gas to spawn (e.g. after breaking uranium ore).
    B:1.26_enableRadonGas=true
    B:1.27.1_enableSteamParticles=true
    B:1.27_enableBabyMode=false

    # Allows re-evaluating power networks on link remove instead of destroying and recreating
    B:1.27_enableReEval=true

    # Enables the update notification in the chat. NOT USED FOR NOW
    B:1.28_enableChangelog=true

    # Allows you to summon the duck via pressing O
    B:1.28_enableDuckButton=true

    # Enables JEI compatibility
    B:1.28_enableJei=true
    B:1.28_enableNonOreDict=true
    B:1.28_enableOreDict=true

    # A general switch for ALL crafting table/smelting recipes. If set to false, all recipes will be disabled.
    B:1.28_enableRecipes=true
    B:1.28_enableShaped=true
    B:1.28_enableShapeless=true

    # A general switch for ALL the tanks items in the mod (e.g. universal fluid, lead, barrels, packed containers). If set to false, they won't be registered as items in the game.
    B:1.28_registerTanks=true

    # Enables the bloom effect which can be visible on the Crucible. Only active if enableShaders2 is set to true.
    B:1.30_enableBloom=true

    # Enables the heat distortion effect. Only active if enableShaders2 is set to true.
    B:1.30_enableHeatDistortion=true

    # Enables a 3 dimensional version of the radiation system that also allows some blocks (like concrete bricks) to stop it from spreading
    B:1.31_enableAdvancedRadiation=true

    # If enabled, registers a custom overworld provider which modifies lighting and sky colors for post-impact effects.
    B:1.32_enableImpactWorldProvider=true

    # Enables the over-the-top blood visual effects for some weapons
    B:1.32_enable_blood_effects=true

    # How many times you can use the crucible before recharge
    I:1.33_crucible_max_charges=16
    B:1.34_enableWelcomeMessage=true

    # If enabled, NTM cables will automatically convert FE <-> HE. Note: WILL MAKE ALL OTHER MODS' CABLES USELESS
    B:1.35.1_autoCableConversion=false

    # One HE is (insert number) RF - <number> (double)
    D:1.35_conversionRateHeToRF=1.0

    # If enabled, shows the 'Loaded mod!' chat message as well as update notifications when joining a world
    B:1.36_enableMOTD=true
    I:1.36_infoOverlayPosition=0

    # If enabled, fluid containers will be oredicted and interchangable in recipes with other mods' containers. Should probably work with things like IE's/GC oil properly.
    B:1.37_enableFluidContainerCompat=true
    B:1.37_enableGuideBook=true
    I:1.38_decoToIngotConversionRate=75

    # If enabled, gives players the guide book when joining the world for the first time
    B:1.38_enableGuideBook=true

    # Chance of successful turning a deco block into an ingot. Default is 25%
    I:1.39_decoToIngotConversionRate=25
    B:1.39_threadedAtmospheres=true
    B:1.40_hardcoreDarkness=false

    # If enabled, will run atmosphere blobbing in a separate thread for performance
    B:1.40_threadedAtmospheres=true
    B:1.41_enableKeybindOverlap=true

    # If enabled, will handle keybinds that would otherwise be ignored due to overlapping.
    B:1.42_enableKeybindOverlap=true

    # Requires large large machines to have a proper foundation, or else they tilt and break. Independent from the 528 version of this config, which does the same, but only works with 528 enabled.
    B:1.44_enableMachineGravity=false

    # How far from the center of the dimension can probes generate landing coordinates
    I:1.90_maxProbeDistance=32000

    # Should volcanoes be active when spawning, disabling will prevent natural volcanoes from spewing lava and growing
    B:1.91_enableVolcanoGen=true

    # If enabled, 3 new enhanced version of base fluid barrels that supports partial fill and drain are added.
    B:1.99_CE_enableFluidContainersV2=false

    # Exact generic Forge Fluid containers that should be treated as lead-safe. Entries must use the format modid:item:meta. Default empty means generic Forge Fluid containers are not lead-safe.
    S:1.99_CE_forgeFluidLeadSafeContainers <
     >

    # It does what the name implies.
    B:1.99_enableExpensiveMode=false
}


